<!DOCTYPE html>                              Declares HTML5 document
<html>                                       Root element containing the entire webpage
<head>                                       Stores metadata, title, CSS Links,scripts
  <title>My First Page</title>               browser tab name 
</head>                                       
<body>                                       Visible content of webpage
  <h1>Hello from VS Code</h1>                Largest and most important heading, <h6> is least important.
</body>
</html>                                      Closing tag indicating the end of an element.
